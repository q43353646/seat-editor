<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会议座位编辑系统</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --primary: #4F6EF7;
  --primary-light: #E8EDFF;
  --bg: #F4F5F9;
  --card: #FFFFFF;
  --border: #E3E5EC;
  --text: #1F2333;
  --text-2: #6B7080;
  --danger: #E5484D;
  --success: #30A46C;
  --disabled: #C8CBD6;
  --radius: 10px;
  --shadow: 0 1px 3px rgba(20,24,40,.06), 0 4px 16px rgba(20,24,40,.04);
}
html,body { height:100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  overflow: hidden;
}
/* ===== 顶栏 ===== */
.topbar {
  height: 48px; background: var(--card); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 16px; gap: 12px;
}
.topbar h1 { font-size: 15px; font-weight: 600; }
.topbar .spacer { flex:1; }
.btn {
  border: 1px solid var(--border); background: #fff; color: var(--text);
  padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 12px;
  transition: all .15s; white-space: nowrap;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn-primary { background: var(--primary); color:#fff; border-color: var(--primary); }
.btn-primary:hover { background: #3D5BE0; color:#fff; }
.btn-danger { color: var(--danger); border-color: #F3C2C4; }
.btn-danger:hover { background: #FFF1F1; }
.btn-sm { padding: 4px 10px; font-size: 12px; }
/* ===== 主布局 ===== */
.main {
  display: flex;
  height: calc(100vh - 48px);
  gap: 0; padding: 10px;
}
.col-left { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; min-width: 200px; }
.col-center { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 0 10px; }
.col-right { width: 400px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; min-width: 260px; }
.panel {
  background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-head {
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}
.panel-body { padding: 10px; overflow: auto; flex: 1; }
/* ===== 左栏：区域编辑 ===== */
#regionEditPanel { flex: 1.2; }
#regionPreviewPanel { flex: 1; }
.region-grid-wrap {
  display: flex; justify-content: center; align-items: center;
  padding: 14px; overflow: auto;
}
.region-grid {
  display: grid; gap: 6px; position: relative;
}
.region-cell {
  width: 78px; height: 56px; border-radius: 8px;
  background: var(--primary-light); color: var(--primary);
  display: flex; align-items: center; justify-content: center;
  font-weight: 600; font-size: 13px; cursor: grab; user-select: none;
  border: 2px solid transparent; transition: all .15s; position: relative;
}
.region-cell:hover { border-color: var(--primary); }
.region-cell.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.15); }
.region-cell .del {
  position: absolute; top: -6px; right: -6px; width: 16px; height: 16px;
  background: var(--danger); color: #fff; border-radius: 50%;
  font-size: 10px; line-height: 16px; text-align: center; cursor: pointer;
  display: none;
}
.region-cell:hover .del { display: block; }
.add-btn {
  width: 24px; height: 24px; border-radius: 6px; background: #fff;
  border: 1px dashed #B8BCCB; color: #8A8FA3; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; line-height: 1; transition: all .15s;
  justify-self: center; align-self: center;
}
.add-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
/* 区域预览 */
.stage-preview {
  background: #2D3142; color: #fff; text-align: center;
  padding: 6px; border-radius: 6px; font-size: 12px; margin-bottom: 10px;
}
.preview-row { display: flex; gap: 10px; flex-wrap: wrap; }
.preview-cell {
  border: 1px solid var(--border); border-radius: 6px; padding: 6px;
  cursor: pointer; transition: all .15s; min-width: 80px;
}
.preview-cell:hover, .preview-cell.active { border-color: var(--primary); }
.preview-cell .t { font-size: 11px; font-weight: 600; margin-bottom: 4px; text-align: center; }
.preview-grid { display: grid; gap: 1px; justify-content: center; margin: 0 auto; }
.preview-seat { width: 8px; height: 8px; border-radius: 2px; background: #E8E9EF; }
.preview-seat.occ { background: var(--primary); }
.preview-seat.off { background: var(--disabled); }
/* ===== 中栏：座位编辑 ===== */
#seatPanel { flex: 1; }
.seat-toolbar {
  padding: 8px 14px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  flex-shrink: 0; background: #FAFBFD;
}
.stepper { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.stepper button {
  width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--border);
  background: #fff; cursor: pointer; font-size: 14px; line-height: 1;
}
.stepper button:hover { border-color: var(--primary); color: var(--primary); }
.stepper .val { min-width: 20px; text-align: center; font-weight: 600; }
.toggle-edit {
  padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border);
  background: #fff; cursor: pointer; font-size: 12px;
}
.toggle-edit.on { background: #FFF3CD; border-color: #E8C547; color: #8A6D00; }
.canvas-wrap {
  flex: 1; overflow: auto; padding: 20px;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  position: relative;
}
.canvas-wrap.full { padding: 0; overflow: hidden; }
.stage {
  width: 60%; max-width: 500px; background: #2D3142; color: #fff;
  text-align: center; padding: 10px; border-radius: 8px; font-size: 13px;
  letter-spacing: 4px; flex-shrink: 0;
}
.seat-region { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.region-label { font-size: 12px; color: var(--text-2); margin-bottom: 2px; font-weight: 600; }
.seat-grid { display: grid; gap: 6px; }
.seat {
  width: 76px; height: 60px; border-radius: 8px;
  background: #fff; border: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all .12s; padding: 3px; text-align: center;
  position: relative; overflow: hidden;
}
.seat:hover { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.1); }
.seat.empty { background: #fff; }
.seat.occupied { background: var(--primary); border-color: var(--primary); color: #fff; }
.seat.off { background: var(--disabled); border-color: var(--disabled); cursor: not-allowed; color: #8A8FA3; }
.seat.off:hover { box-shadow: none; border-color: var(--disabled); }
.seat.locate-flash {
  animation: locatePulse 0.5s infinite;
  z-index: 5;
}
@keyframes locatePulse {
  0%, 100% { box-shadow: 0 0 0 2px #F59E0B, 0 0 8px rgba(245,158,11,0.6); }
  50% { box-shadow: 0 0 0 4px rgba(245,158,11,0.5), 0 0 16px rgba(245,158,11,0.9); }
}
@keyframes locateFlash {
  0%, 100% { box-shadow: 0 0 0 2px #F59E0B, 0 0 8px rgba(245,158,11,0.6); }
  50% { box-shadow: 0 0 0 4px rgba(245,158,11,0.3), 0 0 18px rgba(245,158,11,1); }
}
.seat .seat-id { font-size: 9px; opacity: .7; line-height: 1; margin-bottom: 1px; }
.seat .seat-name { font-size: 11px; font-weight: 600; line-height: 1.2; }
.seat .seat-meta { font-size: 9px; opacity: .85; line-height: 1.2; }
.seat.drag-over { outline: 2px dashed var(--primary); outline-offset: 2px; }
/* ===== 右栏：人员列表 ===== */
#unseatPanel { flex: 1.2; }
#seatPersonPanel { flex: 1; }
.search-row { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); flex-direction: column; gap: 4px; }
.search-row input {
  padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px;
  font-size: 12px; width: 100%; outline: none;
}
.search-row input:focus { border-color: var(--primary); }
.list-tools { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
.list-tools .btn { flex: 1; padding: 5px 4px; font-size: 11px; }
table.person-table { width: 100%; border-collapse: collapse; font-size: 12px; }
table.person-table th, table.person-table td {
  padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--border);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
table.person-table th { color: var(--text-2); font-weight: 500; background: #FAFBFD; position: sticky; top: 0; }
table.person-table tr { cursor: pointer; }
table.person-table tbody tr:hover { background: var(--primary-light); }
table.person-table tbody tr.selected { background: var(--primary-light); }
.person-list { overflow: auto; flex: 1; }
.empty-tip { text-align: center; color: #B0B4C2; padding: 30px 0; font-size: 12px; }
/* ===== 弹窗 ===== */
.modal-mask {
  position: fixed; inset: 0; background: rgba(20,24,40,.4);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal-mask.show { display: flex; }
.modal {
  background: #fff; border-radius: 12px; padding: 20px; min-width: 360px;
  max-width: 90vw; max-height: 85vh; overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,.2);
}
.modal h3 { font-size: 15px; margin-bottom: 14px; }
.form-row { margin-bottom: 10px; }
.form-row label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.form-row input, .form-row select {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border);
  border-radius: 6px; font-size: 13px; outline: none;
}
.form-row input:focus { border-color: var(--primary); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
/* 换座缩略图弹窗 */
.swap-region-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
.swap-region-item {
  border: 1px solid var(--border); border-radius: 8px; padding: 10px;
  cursor: pointer; text-align: center; transition: all .15s;
}
.swap-region-item:hover { border-color: var(--primary); background: var(--primary-light); }
/* tooltip */
.tooltip {
  position: fixed; background: #1F2333; color: #fff; padding: 10px 12px;
  border-radius: 8px; font-size: 12px; line-height: 1.6; z-index: 200;
  pointer-events: none; display: none; max-width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.tooltip .t-name { font-size: 14px; font-weight: 600; }
/* 菜单 */
.popover-menu {
  position: fixed; background: #fff; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15);
  border: 1px solid var(--border); z-index: 150; overflow: hidden; display: none;
}
.popover-menu button {
  display: block; width: 100%; padding: 8px 16px; background: none; border: none;
  text-align: left; cursor: pointer; font-size: 13px;
}
.popover-menu button:hover { background: var(--primary-light); color: var(--primary); }
/* toast */
.toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  background: #1F2333; color: #fff; padding: 8px 18px; border-radius: 20px;
  font-size: 13px; z-index: 300; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
.hidden { display: none !important; }

/* ===== 全局布局视图 ===== */
.layout-viewport {
  position: relative; flex: 1; overflow: hidden; width: 100%;
  background: #FAFBFD; cursor: default;
  user-select: none; -webkit-user-select: none;
}
.layout-viewport.panning { cursor: grabbing; }
.layout-canvas {
  position: absolute; top: 0; left: 0; transform-origin: 0 0;
  padding: 40px;
}
.layout-stage {
  width: 400px; max-width: 400px; margin: 0 auto 30px;
}
.layout-region {
  position: absolute; background: #fff; border: 1px solid var(--border);
  border-radius: 8px; padding: 8px; cursor: pointer; transition: border-color .15s;
}
.layout-region:hover { border-color: var(--primary); }
.layout-region.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,110,247,.15); }
.layout-region .lr-label {
  font-size: 12px; font-weight: 600; margin-bottom: 6px; text-align: center; color: var(--text);
}
.layout-seat-grid { display: grid; gap: 3px; }
.ls {
  width: 22px; height: 18px; border-radius: 3px; background: #EEF0F5;
}
.ls.occ { background: var(--primary); }
.ls.off { background: var(--disabled); }
.minimap {
  position: absolute; right: 14px; bottom: 14px; width: 200px;
  background: rgba(255,255,255,.95); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px; box-shadow: var(--shadow); z-index: 10;
}
.minimap-title { font-size: 10px; color: var(--text-2); text-align: center; margin-bottom: 4px; }
#minimapCanvas { display: block; width: 188px; height: 128px; background: #F4F5F9; border-radius: 4px; }
.layout-hint {
  position: absolute; left: 14px; bottom: 14px; font-size: 11px; color: var(--text-2);
  background: rgba(255,255,255,.9); padding: 4px 10px; border-radius: 6px; z-index: 10;
}
/* 公司性质图例 */
.legend {
  position: absolute; left: 14px; top: 14px; background: rgba(255,255,255,.95);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
  font-size: 11px; z-index: 10; box-shadow: var(--shadow);
}
.legend .t { font-weight: 600; margin-bottom: 6px; font-size: 11px; }
.legend .item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; }
/* 三栏拖拽调宽 */
.col-resizer {
  width: 5px; cursor: col-resize; background: transparent; flex-shrink: 0;
  transition: background .15s;
}
.col-resizer:hover, .col-resizer.active { background: var(--primary); }
/* 公司性质配色 */
.nature-政府 { background: #E5484D !important; border-color: #E5484D !important; }
.nature-国企 { background: #4F6EF7 !important; border-color: #4F6EF7 !important; }
.nature-民企 { background: #30A46C !important; border-color: #30A46C !important; }
.nature-外企 { background: #F59E0B !important; border-color: #F59E0B !important; }
.nature-其他 { background: #8B5CF6 !important; border-color: #8B5CF6 !important; }
</style>
</head>
<body>

<div class="topbar">
  <h1>会议座位编辑系统</h1>
  <span id="dbStatus" style="font-size:11px;color:var(--text-2);margin-left:8px">未连接</span>
  <div class="spacer"></div>
  <button class="btn btn-sm" onclick="openDbConfig()">数据库配置</button>
  <button class="btn btn-sm" onclick="downloadTemplate()">下载导入模板</button>
  <button class="btn btn-sm" onclick="exportImage()">导出座位图</button>
  <button class="btn btn-sm" onclick="exportLayout()">导出布局备份</button>
  <button class="btn btn-sm" onclick="document.getElementById('importLayoutFile').click()">导入布局备份</button>
  <input type="file" id="importLayoutFile" accept=".json" class="hidden" onchange="importLayout(event)">
</div>

<div class="main">
  <!-- 左栏 -->
  <div class="col-left">
    <div class="panel" id="regionEditPanel">
      <div class="panel-head">区域编辑</div>
      <div class="panel-body region-grid-wrap" id="regionGridWrap"></div>
    </div>
    <div class="panel" id="regionPreviewPanel">
      <div class="panel-head">区域预览</div>
      <div class="panel-body">
        <div class="stage-preview">舞 台</div>
        <div class="preview-row" id="previewRow"></div>
      </div>
    </div>
  </div>
  <div class="col-resizer" id="resizer1"></div>

  <!-- 中栏 -->
  <div class="col-center">
  <div class="panel" id="seatPanel">
    <div class="panel-head">座位编辑</div>
    <div class="seat-toolbar">
      <span style="color:var(--text-2);font-size:12px">座位布局：</span>
      <div class="stepper">
        <button onclick="adjustDims(-1,'rows')">−</button>
        <span class="val" id="rowsVal">7</span> 排
        <button onclick="adjustDims(1,'rows')">＋</button>
      </div>
      <div class="stepper">
        <button onclick="adjustDims(-1,'cols')">−</button>
        <span class="val" id="colsVal">6</span> 列
        <button onclick="adjustDims(1,'cols')">＋</button>
      </div>
      <button class="btn btn-sm" onclick="confirmDims()">确认</button>
      <button class="btn btn-sm toggle-edit" id="editModeBtn" onclick="toggleEditMode()">座位编辑模式</button>
      <button class="btn btn-sm toggle-edit" id="layoutModeBtn" onclick="toggleLayoutMode()">布局视图</button>
      <button class="btn btn-sm" onclick="openMoveModal()">批量移动</button>
      <div class="spacer" style="flex:1"></div>
      <span id="statsBar" style="font-size:11px;color:var(--text-2);margin-right:10px"></span>
      <button class="btn btn-sm btn-danger" onclick="clearRegion()">清空本区域</button>
    </div>
    <div class="canvas-wrap" id="canvasWrap">
      <div class="legend" id="legendBox">
        <div class="t">公司性质图例</div>
        <div id="legendItems"></div>
      </div>
      <div class="stage" id="stageNormal">舞 台</div>
      <div class="seat-region" id="seatRegion"></div>
      <!-- 全局布局视图 -->
      <div class="layout-viewport hidden" id="layoutViewport">
        <div class="layout-canvas" id="layoutCanvas">
          <div class="stage layout-stage">舞 台</div>
          <div id="layoutRegions"></div>
        </div>
        <div class="minimap" id="minimap">
          <div class="minimap-title">小地图</div>
          <canvas id="minimapCanvas" width="200" height="140"></canvas>
        </div>
        <div class="layout-hint" id="layoutHint">按住空格 + 拖拽平移 · 滚轮缩放</div>
      </div>
    </div>
  </div>
  </div>
  <div class="col-resizer" id="resizer2"></div>

  <!-- 右栏 -->
  <div class="col-right">
    <div class="panel" id="unseatPanel">
      <div class="panel-head">未入座人员 <span id="unseatCount" style="margin-left:auto;font-weight:400;color:var(--text-2);font-size:11px"></span></div>
      <div class="search-row">
        <input type="text" id="searchCompany" placeholder="请输入查询的公司名" oninput="renderUnseated()">
        <input type="text" id="searchName" placeholder="请输入查询的人员名" oninput="renderUnseated()">
      </div>
      <div class="list-tools">
        <button class="btn btn-primary" onclick="openAddPerson()">添加人员</button>
        <button class="btn" onclick="document.getElementById('importFile').click()">清单导入</button>
        <button class="btn btn-danger" onclick="clearUnseated()">清空</button>
        <input type="file" id="importFile" accept=".xlsx,.xls" class="hidden" onchange="importPeople(event)">
      </div>
      <div class="person-list" id="unseatedList"
        ondragover="event.preventDefault()"
        ondrop="dropToUnseated(event)">
        <table class="person-table">
          <thead><tr><th style="width:30px">#</th><th>性质</th><th>公司</th><th>姓名</th><th>职位</th><th>手机号</th><th>车牌</th></tr></thead>
          <tbody id="unseatedBody"></tbody>
        </table>
        <div class="empty-tip" id="unseatedEmpty">暂无未入座人员，可将座位上的人员拖到此处释放</div>
      </div>
    </div>
    <div class="panel" id="seatPersonPanel">
      <div class="panel-head">已入座人员 <span id="seatCount" style="margin-left:auto;font-weight:400;color:var(--text-2);font-size:11px"></span></div>
      <div class="search-row">
        <input type="text" id="searchCompany2" placeholder="请输入查询的公司名" oninput="renderSeated()">
        <input type="text" id="searchName2" placeholder="请输入查询的人员名" oninput="renderSeated()">
      </div>
      <div class="list-tools">
        <button class="btn" onclick="exportPeople()">清单导出</button>
        <button class="btn btn-danger" onclick="clearSeated()">清空入座</button>
      </div>
      <div class="person-list">
        <table class="person-table">
          <thead><tr><th style="width:30px">#</th><th>座位号</th><th>性质</th><th>公司</th><th>姓名</th><th>职位</th><th>手机号</th></tr></thead>
          <tbody id="seatedBody"></tbody>
        </table>
        <div class="empty-tip" id="seatedEmpty">暂无已入座人员</div>
      </div>
    </div>
  </div>
</div>

<!-- 添加人员弹窗 -->
<div class="modal-mask" id="addPersonModal">
  <div class="modal">
    <h3>添加人员</h3>
    <div class="form-row"><label>公司性质</label><input id="f_nature" placeholder="如：政府/国企/民企/外企等"></div>
    <div class="form-row"><label>公司名称</label><input id="f_company"></div>
    <div class="form-row"><label>人员姓名</label><input id="f_name"></div>
    <div class="form-row"><label>职位</label><input id="f_title"></div>

<script>
// ==================== 状态 ====================
const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
let state = {
  regions: [],        // {id,name,rows,cols,gx,gy,seats:[row][col]} seats: null|{off:true}|{personId}
  people: [],        // {id,company,name,title,phone,driver,plate,seatedAt:{regionId,row,col}|null}
  selectedRegionId: null,
  editMode: false,
  nextLetterIdx: 1,
  pendingSwapPersonId: null,  // 正在换座的人
  menuContext: null,           // {regionId,row,col}
  layoutMode: false,           // 全局布局视图
  viewScale: 0.6,
  viewX: 0, viewY: 0,
  spaceDown: false,
  panStart: null,
};
let uidCounter = 1;
const uid = () => 'id' + (uidCounter++) + '_' + Date.now().toString(36);

let sbConfig = {url:'', key:'', room:'default'};

function loadDbConfig() {
  try {
    const c = JSON.parse(localStorage.getItem('sb_config') || '{}');
    sbConfig = c;
  } catch(e) {}
}
function openDbConfig() {
  document.getElementById('sb_url').value = sbConfig.url || '';
  document.getElementById('sb_key').value = sbConfig.key || '';
  document.getElementById('sb_room').value = sbConfig.room || 'default';
  document.getElementById('dbConfigModal').classList.add('show');
}
function sbReady() { return sbConfig.url && sbConfig.key; }
async function sbFetch(path, options) {
  const headers = Object.assign({
    'apikey': sbConfig.key,
    'Authorization': 'Bearer ' + sbConfig.key,
    'Content-Type': 'application/json'
  }, options.headers || {});
  const res = await fetch(sbConfig.url + '/rest/v1' + path, Object.assign({}, options, {headers}));
  if (!res.ok) {
    const txt = await res.text();
    throw new Error('HTTP ' + res.status + ': ' + txt.substring(0, 200));
  }
  const ct = res.headers.get('content-type') || '';
  if (ct.includes('application/json')) return res.json();
  return null;
}
async function saveDbConfig() {
  sbConfig = {
    url: document.getElementById('sb_url').value.trim().replace(/\/+$/, ''),
    key: document.getElementById('sb_key').value.trim(),
    room: document.getElementById('sb_room').value.trim() || 'default'
  };
  localStorage.setItem('sb_config', JSON.stringify(sbConfig));
  closeModal('dbConfigModal');
  if (sbConfig.url && sbConfig.key) {
    setDbStatus('连接中...', '#F59E0B');
    try {
      await loadFromDb();
      renderAll();
      setDbStatus('已连接', '#30A46C');
      toast('已连接数据库');
    } catch(e) {
      console.error(e);
      setDbStatus('连接失败', '#E5484D');
      alert('连接失败：' + e.message);
    }
  }
}

async function loadFromDb() {
  const rows = await sbFetch('/app_state?room=eq.' + encodeURIComponent(sbConfig.room) + '&select=data', {method: 'GET'});
  if (rows && rows.length > 0 && rows[0].data) {
    state = Object.assign(state, rows[0].data);
  }
}
function setDbStatus(text, color) {
  const el = document.getElementById('dbStatus');
  el.textContent = text;
  el.style.color = color || 'var(--text-2)';
}
async function saveToDb() {
  if (!sbReady()) return;
  setDbStatus('保存中...', '#F59E0B');
  try {
    // 生成公开位图：只记录座位占用状态，不含人员信息
    state.publicMap = {
      regions: state.regions.map(r => ({
        id: r.id, name: r.name, gx: r.gx, gy: r.gy, rows: r.rows, cols: r.cols,
        seats: r.seats.map(row => row.map(s => s ? (s.off ? 'off' : 1) : 0))
      }))
    };
    // 写入主状态
    await sbFetch('/app_state?on_conflict=room', {
      method: 'POST',
      headers: {'Prefer': 'resolution=merge-duplicates'},
      body: JSON.stringify({room: sbConfig.room, data: state, updated_at: new Date().toISOString()})
    });
    // 同步人员表（供移动端按手机号查询）
    const peopleRows = state.people.map(p => ({
      room: sbConfig.room,
      phone: p.phone,
      name: p.name,
      company: p.company,
      title: p.title,
      seated_at: p.seatedAt
    }));
    // 先删旧的再插新的（简单粗暴）
    await sbFetch('/people?room=eq.' + sbConfig.room, {method: 'DELETE'});
    if (peopleRows.length) {
      await sbFetch('/people', {
        method: 'POST',
        body: JSON.stringify(peopleRows)
      });
    }
    setDbStatus('已保存到云', '#30A46C');
  } catch(e) {
    console.warn('save error', e);
    setDbStatus('保存失败', '#E5484D');
  }
}

function load() {
  try {
    const raw = localStorage.getItem('seatEditor_v1');
    if (raw) {
      const s = JSON.parse(raw);
      state = Object.assign(state, s);
      return true;
    }
  } catch(e) {}
  return false;
}
function save() {
  localStorage.setItem('seatEditor_v1', JSON.stringify(state));
  saveToDb();
}

// ==================== 初始化 ====================
async function init() {
  loadDbConfig();
  if (sbReady()) {
    setDbStatus('连接中...', '#F59E0B');
    try {
      await loadFromDb();
      setDbStatus('已连接', '#30A46C');
    } catch(e) {
      console.warn('auto connect failed', e);
      setDbStatus('连接失败', '#E5484D');
    }
  }
  if (!state.regions || state.regions.length === 0) {
    const a = createRegion('A区', 7, 6, 0, 0);
    state.regions = [a];
    state.selectedRegionId = a.id;
    state.nextLetterIdx = 1;
    state.people = [];
  }
  initLayoutEvents();
  initResizers();
  renderAll();
}
function createRegion(name, rows, cols, gx, gy) {
  const seats = [];
  for (let r = 0; r < rows; r++) {
    const row = [];
    for (let c = 0; c < cols; c++) row.push(null);
    seats.push(row);
  }
  return { id: uid(), name, rows, cols, gx, gy, seats };
}
function curRegion() { return state.regions.find(r => r.id === state.selectedRegionId); }

// ==================== 渲染：全部 ====================
function renderAll() {
  renderRegionGrid();
  renderPreview();
  renderSeatCanvas();
  if (state.layoutMode) renderLayoutView();
  renderUnseated();
  renderSeated();
  renderLegend();
  renderStats();
  save();
}
function renderStats() {
  // 当前区域统计
  const r = curRegion();
  let regionPeople = 0, regionCompanies = new Set();
  if (r) {
    r.seats.forEach(row => row.forEach(s => {
      if (s && s.personId) {
        regionPeople++;
        const p = state.people.find(pp => pp.id === s.personId);
        if (p) regionCompanies.add(p.company);
      }
    }));
  }
  // 全场统计
  const allPeople = state.people.filter(p => p.seatedAt);
  const allCompanies = new Set(allPeople.map(p => p.company));
  const totalPeople = allPeople.length;
  const totalCompanies = allCompanies.size;
  const regionCount = state.regions.length;

  // 工具栏统计
  const bar = document.getElementById('statsBar');
  if (state.layoutMode) {
    bar.innerHTML = `选中区域：${r ? r.name : '-'} ${regionPeople}人/${regionCompanies.size}公司　|　全场：${totalPeople}人/${totalCompanies}公司/${regionCount}区域`;
  } else {
    bar.innerHTML = `当前区域：${r ? r.name : '-'} ${regionPeople}人/${regionCompanies.size}公司`;
  }
  // 列表统计
  const unseat = state.people.filter(p => !p.seatedAt);
  document.getElementById('unseatCount').textContent = `${unseat.length}人 / ${new Set(unseat.map(p=>p.company)).size}公司`;
  document.getElementById('seatCount').textContent = `${totalPeople}人 / ${totalCompanies}公司`;
}
function renderLegend() {
  // 先触发所有人员的颜色分配
  state.people.forEach(p => getNatureColor(p.nature));
  const box = document.getElementById('legendItems');
  box.innerHTML = '';
  Object.keys(natureColorMap).forEach(n => {
    const item = document.createElement('div');
    item.className = 'item';
    item.innerHTML = `<div class="dot" style="background:${natureColorMap[n]}"></div>${esc(n)}`;
    box.appendChild(item);
  });
}

// ==================== 左栏：区域网格 ====================
function renderRegionGrid() {
  const wrap = document.getElementById('regionGridWrap');
  // 计算网格范围，并向外扩展一圈以显示相邻空位的 + 按钮
  let minX=0,maxX=0,minY=0,maxY=0;
  state.regions.forEach(r => {
    minX = Math.min(minX, r.gx); maxX = Math.max(maxX, r.gx);
    minY = Math.min(minY, r.gy); maxY = Math.max(maxY, r.gy);
  });
  minX -= 1; maxX += 1; minY -= 1; maxY += 1;
  const w = maxX - minX + 1, h = maxY - minY + 1;
  const grid = document.createElement('div');
  grid.className = 'region-grid';
  grid.style.gridTemplateColumns = `repeat(${w}, 84px)`;
  grid.style.gridTemplateRows = `repeat(${h}, 62px)`;

  // 构建每个格子
  const cellMap = {};
  state.regions.forEach(r => {
    cellMap[r.gy - minY + '_' + (r.gx - minX)] = r;
  });
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const key = y + '_' + x;
      const reg = cellMap[key];
      if (reg) {
        const div = document.createElement('div');
        div.className = 'region-cell' + (reg.id === state.selectedRegionId ? ' active' : '');
        div.textContent = reg.name;
        div.draggable = true;
        div.title = '点击选中，拖动换位，双击改名';
        div.onclick = () => { state.selectedRegionId = reg.id; renderAll(); };
        div.ondblclick = () => renameRegion(reg);
        div.ondragstart = (e) => { e.dataTransfer.setData('srcRegion', reg.id); };
        div.ondragover = (e) => e.preventDefault();
        div.ondrop = (e) => {
          e.preventDefault();
          const srcId = e.dataTransfer.getData('srcRegion');
          if (srcId && srcId !== reg.id) swapRegionPos(srcId, reg.id);
        };
        if (state.regions.length > 1) {
          const del = document.createElement('span');
          del.className = 'del'; del.textContent = '×';
          del.onclick = (e) => { e.stopPropagation(); deleteRegion(reg); };
          div.appendChild(del);
        }
        grid.appendChild(div);
      } else {
        // 空位：检查是否相邻于某个区域，若是则显示+号
        const cx = x + minX, cy = y + minY;
        const near = state.regions.find(r =>
          Math.abs(r.gx - cx) + Math.abs(r.gy - cy) === 1
        );
        const div = document.createElement('div');
        if (near) {
          div.className = 'add-btn'; div.textContent = '+';
          div.title = '在' + near.name + '旁边添加区域';
          div.onclick = () => openAddRegion(cx, cy);
        } else {
          div.style.width = '78px'; div.style.height = '56px';
        }
        // 空位也接收拖放：把区域移到此位置
        div.ondragover = (e) => e.preventDefault();
        div.ondrop = (e) => {
          e.preventDefault();
          const srcId = e.dataTransfer.getData('srcRegion');
          if (srcId) {
            const src = state.regions.find(r => r.id === srcId);
            if (src && !(src.gx === cx && src.gy === cy)) {
              // 目标空位若已有区域则交换，否则直接移动
              const dst = state.regions.find(r => r.gx === cx && r.gy === cy);
              if (dst) { const tgx=src.gx,tgy=src.gy; src.gx=dst.gx; src.gy=dst.gy; dst.gx=tgx; dst.gy=tgy; }
              else { src.gx = cx; src.gy = cy; }
              renderAll();
            }
          }
        };
        grid.appendChild(div);
      }
    }
  }
  wrap.innerHTML = '';
  wrap.appendChild(grid);
}

function renameRegion(reg) {
  const n = prompt('修改区域名称：', reg.name);
  if (n && n.trim()) { reg.name = n.trim(); renderAll(); }
}
function deleteRegion(reg) {
  confirmDialog('删除区域', `确定删除「${reg.name}」吗？区域内已入座人员将全部释放回未入座列表。`, () => {
    // 释放该区域人员
    reg.seats.forEach(row => row.forEach(s => {
      if (s && s.personId) {
        const p = state.people.find(p => p.id === s.personId);
        if (p) p.seatedAt = null;
      }
    }));
    state.regions = state.regions.filter(r => r.id !== reg.id);
    if (state.selectedRegionId === reg.id) state.selectedRegionId = state.regions[0].id;
    renderAll();
    toast('已删除');
  });
}
function swapRegionPos(srcId, dstId) {
  const s = state.regions.find(r => r.id === srcId);
  const d = state.regions.find(r => r.id === dstId);
  if (!s || !d) return;
  // 交换位置（网格吸附：只允许相邻交换，或与空位交换）
  const tgx = s.gx, tgy = s.gy;
  s.gx = d.gx; s.gy = d.gy;
  d.gx = tgx; d.gy = tgy;
  renderAll();
}

// 新增区域弹窗
let addRegionPos = {gx:0, gy:0};
function openAddRegion(gx, gy) {
  addRegionPos = {gx, gy};
  document.getElementById('fr_name').value = LETTERS[state.nextLetterIdx % 26] + '区';
  document.getElementById('fr_rows_val').textContent = 5;
  document.getElementById('fr_cols_val').textContent = 4;
  document.getElementById('addRegionModal').classList.add('show');
}
function adjustRegionDims(d, key) {
  const el = document.getElementById(key === 'rows' ? 'fr_rows_val' : 'fr_cols_val');
  let v = parseInt(el.textContent) + d;
  v = Math.max(1, Math.min(30, v));
  el.textContent = v;
}
function confirmAddRegion() {
  const name = document.getElementById('fr_name').value.trim() || (LETTERS[state.nextLetterIdx % 26] + '区');
  const rows = parseInt(document.getElementById('fr_rows_val').textContent) || 5;
  const cols = parseInt(document.getElementById('fr_cols_val').textContent) || 4;
  // 检查位置是否已被占用
  if (state.regions.find(r => r.gx === addRegionPos.gx && r.gy === addRegionPos.gy)) {
    toast('该位置已存在区域'); return;
  }
  const r = createRegion(name, rows, cols, addRegionPos.gx, addRegionPos.gy);
  state.regions.push(r);
  state.selectedRegionId = r.id;
  state.nextLetterIdx++;
  closeModal('addRegionModal');
  renderAll();
  toast('已添加 ' + name);
}

// ==================== 左栏：区域预览 ====================
function renderPreview() {
  const row = document.getElementById('previewRow');
  row.innerHTML = '';
  row.style.display = 'grid';
  // 计算范围
  let minX=0,maxX=0,minY=0,maxY=0;
  state.regions.forEach(r => {
    minX = Math.min(minX, r.gx); maxX = Math.max(maxX, r.gx);
    minY = Math.min(minY, r.gy); maxY = Math.max(maxY, r.gy);
  });
  const w = maxX - minX + 1, h = maxY - minY + 1;
  row.style.gridTemplateColumns = `repeat(${w}, 1fr)`;
  row.style.gap = '6px';
  const cellMap = {};
  state.regions.forEach(r => {
    cellMap[(r.gy-minY)+'_'+(r.gx-minX)] = r;
  });
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const reg = cellMap[y+'_'+x];
      const cell = document.createElement('div');
      if (reg) {
        cell.className = 'preview-cell' + (reg.id === state.selectedRegionId ? ' active' : '');
        cell.innerHTML = `<div class="t">${reg.name}</div>`;
        const g = document.createElement('div');
        g.className = 'preview-grid';
        g.style.gridTemplateColumns = `repeat(${reg.cols}, 8px)`;
        reg.seats.forEach(row => row.forEach(s => {
          const d = document.createElement('div');
          d.className = 'preview-seat' + (s && s.off ? ' off' : (s && s.personId ? ' occ' : ''));
          g.appendChild(d);
        }));
        cell.appendChild(g);
        cell.onclick = () => { state.selectedRegionId = reg.id; renderAll(); };
      } else {
        cell.style.visibility = 'hidden';
      }
      row.appendChild(cell);
    }
  }
}

// ==================== 中栏：座位画布 ====================
function adjustDims(d, key) {
  const r = curRegion(); if (!r) return;
  if (key === 'rows') r.rows = Math.max(1, Math.min(30, r.rows + d));
  else r.cols = Math.max(1, Math.min(30, r.cols + d));
  document.getElementById('rowsVal').textContent = r.rows;
  document.getElementById('colsVal').textContent = r.cols;
}
function confirmDims() {
  const r = curRegion(); if (!r) return;
  // 重建座位矩阵，保留已有数据
  const newSeats = [];
  for (let i = 0; i < r.rows; i++) {
    const row = [];
    for (let j = 0; j < r.cols; j++) {
      row.push(r.seats[i] && r.seats[i][j] ? r.seats[i][j] : null);
    }
    newSeats.push(row);
  }
  r.seats = newSeats;
  renderAll();
  toast('已更新 ' + r.rows + '排×' + r.cols + '列');
}
function toggleEditMode() {
  state.editMode = !state.editMode;
  document.getElementById('editModeBtn').classList.toggle('on', state.editMode);
  renderSeatCanvas();
}
function clearRegion() {
  const r = curRegion(); if (!r) return;
  confirmDialog('清空本区域', `确定清空「${r.name}」所有已入座人员吗？人员将回到未入座列表。`, () => {
    for (let i = 0; i < r.rows; i++) {
      for (let j = 0; j < r.cols; j++) {
        const s = r.seats[i][j];
        if (s && s.personId) {
          const p = state.people.find(p => p.id === s.personId);
          if (p) p.seatedAt = null;
        }
        if (s && !s.off) r.seats[i][j] = null;
      }
    }
    renderAll();
    toast('已清空');
  });
}
function renderSeatCanvas() {
  document.getElementById('rowsVal').textContent = curRegion() ? curRegion().rows : '-';
  document.getElementById('colsVal').textContent = curRegion() ? curRegion().cols : '-';
  const wrap = document.getElementById('seatRegion');
  const r = curRegion();
  wrap.innerHTML = '';
  if (!r) return;
  const label = document.createElement('div');
  label.className = 'region-label';
  label.textContent = r.name + '（' + r.rows + '排 × ' + r.cols + '列）';
  wrap.appendChild(label);

  const grid = document.createElement('div');
  grid.className = 'seat-grid';
  grid.style.gridTemplateColumns = `repeat(${r.cols}, 76px)`;
  for (let i = 0; i < r.rows; i++) {
    for (let j = 0; j < r.cols; j++) {
      const s = r.seats[i][j];
      const div = document.createElement('div');
      div.className = 'seat';
      div.dataset.seat = r.id + '-' + i + '-' + j;
      const seatId = r.name + '-' + (i+1) + '-' + (j+1);
      if (s && s.off) {
        div.classList.add('off');
        div.innerHTML = `<div class="seat-id">${seatId}</div>`;
      } else if (s && s.personId) {
        const p = state.people.find(pp => pp.id === s.personId);
        div.classList.add('occupied');
        if (p) {
          div.style.background = getNatureColor(p.nature);
          div.style.borderColor = getNatureColor(p.nature);
          div.innerHTML = `<div class="seat-id">${seatId}</div><div class="seat-name">${esc(p.name)}</div><div class="seat-meta">${esc(p.company)}</div><div class="seat-meta">${esc(p.title||'')}</div>`;
          div.onmouseenter = (e) => showTooltip(e, p, seatId);
          div.onmouseleave = hideTooltip;
          div.draggable = true;
          div.ondragstart = (e) => {
            e.dataTransfer.setData('dragPerson', p.id);
            e.dataTransfer.setData('fromSeat', JSON.stringify({regionId:r.id,row:i,col:j}));
            hideTooltip();
          };
          div.onclick = (e) => openSeatMenu(e, r.id, i, j, p);
        }
      } else {
        div.classList.add('empty');
        div.innerHTML = `<div class="seat-id">${seatId}</div>`;
        if (!state.editMode) {
          div.onclick = () => openPickPerson(r.id, i, j);
        }
      }
      // 公共事件
      div.ondragover = (e) => { e.preventDefault(); div.classList.add('drag-over'); };
      div.ondragleave = () => div.classList.remove('drag-over');
      div.ondrop = (e) => {
        e.preventDefault();
        div.classList.remove('drag-over');
        onSeatDrop(r.id, i, j, e);
      };
      if (state.editMode && !(s && s.personId)) {
        div.onclick = (e) => {
          e.stopPropagation();
          r.seats[i][j] = (s && s.off) ? null : {off:true};
          renderAll();
        };
      }
      grid.appendChild(div);
    }
  }
  wrap.appendChild(grid);
}

function onSeatDrop(regionId, row, col, ev) {
  const pId = ev.dataTransfer.getData('dragPerson');
  if (pId) {
    const p = state.people.find(pp => pp.id === pId);
    if (!p) return;
    placePersonAt(p, regionId, row, col);
  }
}
function placePersonAt(p, regionId, row, col) {
  const r = state.regions.find(r => r.id === regionId);
  if (!r) return;
  const target = r.seats[row][col];
  if (target && target.off) { toast('该座位已关闭，不可安排'); return; }
  // 手机号查重
  if (p.phone) {
    const dup = state.people.find(pp => pp.phone === p.phone && pp.id !== p.id && pp.seatedAt);
    if (dup) {
      const dr = state.regions.find(r => r.id === dup.seatedAt.regionId);
      const dupSeat = dr ? (dr.name+'-'+(dup.seatedAt.row+1)+'-'+(dup.seatedAt.col+1)) : '';
      confirmDialog('手机号重复', `该手机号人员已入座「${dupSeat}」（${dup.name}），是否仍要继续入座？`, () => {
        doPlacePerson(p, regionId, row, col, target);
      });
      return;
    }
  }
  doPlacePerson(p, regionId, row, col, target);
}
function doPlacePerson(p, regionId, row, col, target) {
  const r = state.regions.find(r => r.id === regionId);
  const fromPos = p.seatedAt ? {regionId: p.seatedAt.regionId, row: p.seatedAt.row, col: p.seatedAt.col} : null;
  if (target && target.personId) {
    const other = state.people.find(pp => pp.id === target.personId);
    if (!fromPos) { toast('该座位已有人，请拖到空位'); return; }
    confirmDialog('交换座位', `${p.name} 与 ${other ? other.name : '该座位人员'}（${r.name}-${row+1}-${col+1}）交换座位？`, () => {
      const sr = state.regions.find(r => r.id === fromPos.regionId);
      if (sr) sr.seats[fromPos.row][fromPos.col] = {personId: other.id};
      other.seatedAt = {regionId: fromPos.regionId, row: fromPos.row, col: fromPos.col};
      r.seats[row][col] = {personId: p.id};
      p.seatedAt = {regionId, row, col};
      renderAll();
    });
  } else {
    if (fromPos) {
      const sr = state.regions.find(r => r.id === fromPos.regionId);
      if (sr) sr.seats[fromPos.row][fromPos.col] = null;
    }
    r.seats[row][col] = {personId: p.id};
    p.seatedAt = {regionId, row, col};
    renderAll();
  }
}

function openSwapModal() {

  if (!p) return;
  document.getElementById('swapTitle').textContent = `为 ${p.name} 选择目标座位`;

  });

function showSwapSeatPicker(regionId) {
  const r = state.regions.find(r => r.id === regionId);
  const picker = document.getElementById('swapSeatPicker');
  picker.classList.remove('hidden');
  picker.innerHTML = `<div style="font-size:12px;color:var(--text-2);margin-bottom:6px">${r.name} — 点击目标座位</div>`;
  const grid = document.createElement('div');
  grid.style.cssText = 'display:grid;gap:4px;grid-template-columns:repeat('+r.cols+',40px)';
  for (let i = 0; i < r.rows; i++) {
    for (let j = 0; j < r.cols; j++) {
      const s = r.seats[i][j];
      const d = document.createElement('div');
      d.style.cssText = 'width:40px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer;border:1px solid var(--border);';
      if (s && s.off) { d.style.background = 'var(--disabled)'; d.style.cursor='not-allowed'; }
      else if (s && s.personId) {
        const op = state.people.find(pp => pp.id === s.personId);
        d.style.background = 'var(--primary)'; d.style.color = '#fff';
        d.textContent = op ? op.name[0] : '?';
      } else {
        d.style.background = '#fff';
        d.textContent = (i+1)+'-'+(j+1);
      }
      d.onclick = () => confirmSwap(regionId, i, j);
      grid.appendChild(d);
    }
  }
  picker.appendChild(grid);
}
function confirmSwap(regionId, row, col) {
  const p = state.people.find(pp => pp.id === state.pendingSwapPersonId);
  if (!p) return;
  const r = state.regions.find(r => r.id === regionId);
  const target = r.seats[row][col];
  if (target && target.off) { toast('该座位已关闭'); return; }
  if (target && target.personId) {
    const other = state.people.find(pp => pp.id === target.personId);
    confirmDialog('交换座位', `${p.name} 与 ${other.name}（${r.name}-${row+1}-${col+1}）交换座位？`, () => {
      doSwap(p, other, regionId, row, col);
      closeModal('swapModal');
    });
  } else {
    doSwap(p, null, regionId, row, col);
    closeModal('swapModal');
  }
}
function doSwap(p, other, regionId, row, col) {
  // 清除 p 原位置
  if (p.seatedAt) {
    const sr = state.regions.find(r => r.id === p.seatedAt.regionId);
    if (sr) sr.seats[p.seatedAt.row][p.seatedAt.col] = other ? {personId: other.id} : null;
  }
  if (other) {
    other.seatedAt = p.seatedAt;
  }
  const r = state.regions.find(r => r.id === regionId);
  r.seats[row][col] = {personId: p.id};
  p.seatedAt = {regionId, row, col};
  state.pendingSwapPersonId = null;
  renderAll();
}

// ==================== 右栏：人员列表 ====================
function renderUnseated() {
  const kwC = document.getElementById('searchCompany').value.trim();
  const kwN = document.getElementById('searchName').value.trim();
  const list = state.people.filter(p => !p.seatedAt
    && (!kwC || p.company.includes(kwC))

  body.innerHTML = '';
  list.forEach((p, idx) => {
    const tr = document.createElement('tr');
    tr.draggable = true;
    tr.ondragstart = (e) => { e.dataTransfer.setData('dragPerson', p.id); hideTooltip(); };
    tr.innerHTML = `<td>${idx+1}</td><td>${natureBadge(p.nature)}</td><td>${esc(p.company)}</td><td>${esc(p.name)}</td><td>${esc(p.title||'')}</td><td>${esc(p.phone||'')}</td><td>${esc(p.plate||'')}</td>`;
    tr.ondblclick = () => quickSeat(p);
    tr.onclick = () => openEditPerson(p);
    body.appendChild(tr);
  });

}
function renderSeated() {
  const kwC = document.getElementById('searchCompany2').value.trim();
  const kwN = document.getElementById('searchName2').value.trim();
  const list = state.people.filter(p => p.seatedAt
    && (!kwC || p.company.includes(kwC))
    && (!kwN || p.name.includes(kwN)));
  // 按区域顺序
  list.sort((a,b) => {
    const ra = state.regions.findIndex(r => r.id === a.seatedAt.regionId);
    const rb = state.regions.findIndex(r => r.id === b.seatedAt.regionId);
    if (ra !== rb) return ra - rb;
    if (a.seatedAt.row !== b.seatedAt.row) return a.seatedAt.row - b.seatedAt.row;
    return a.seatedAt.col - b.seatedAt.col;
  });
  const body = document.getElementById('seatedBody');
  body.innerHTML = '';
  list.forEach((p, idx) => {
    const r = state.regions.find(r => r.id === p.seatedAt.regionId);
    const seatId = r ? (r.name + '-' + (p.seatedAt.row+1) + '-' + (p.seatedAt.col+1)) : '-';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${idx+1}</td><td class="seat-link" style="color:var(--primary);font-weight:600;cursor:pointer">${seatId}</td><td>${natureBadge(p.nature)}</td><td>${esc(p.company)}</td><td>${esc(p.name)}</td><td>${esc(p.title||'')}</td><td>${esc(p.phone||'')}</td>`;
    tr.onclick = () => openEditPerson(p);
    tr.querySelector('.seat-link').onclick = (e) => { e.stopPropagation(); locatePerson(p); };
    body.appendChild(tr);
  });
  document.getElementById('seatedEmpty').style.display = list.length ? 'none' : 'block';
}
function locatePerson(p) {
  if (!p.seatedAt) return;
  const r = state.regions.find(r => r.id === p.seatedAt.regionId);
  if (!r) return;
  if (state.layoutMode) {
    state.highlightSeat = {regionId: r.id, row: p.seatedAt.row, col: p.seatedAt.col};
    renderLayoutView();
    setTimeout(() => { state.highlightSeat = null; renderLayoutView(); }, 5000);
    return;
  }
  // 主视图：切换到对应区域
  state.selectedRegionId = r.id;
  renderAll();
  setTimeout(() => {
    const seat = document.querySelector(`[data-seat="${r.id}-${p.seatedAt.row}-${p.seatedAt.col}"]`);
    if (seat) {
      seat.classList.add('locate-flash');
      setTimeout(() => seat.classList.remove('locate-flash'), 2000);
    }
  }, 100);
}

function quickSeat(p) {
  // 双击未入座人员：找当前区域第一个空位坐下
  const r = curRegion(); if (!r) { toast('请先选择区域'); return; }
  for (let i = 0; i < r.rows; i++) {
    for (let j = 0; j < r.cols; j++) {
      if (!r.seats[i][j]) {
        placePersonAt(p, r.id, i, j);
        return;
      }
    }
  }
  toast('当前区域无空位');
}

function importPeople(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const wb = XLSX.read(ev.target.result);
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1});
      let n = 0, dup = 0, seated = 0;
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || !row[3]) continue;
        const seatNo = String(row[0]||'').trim();
        const nature = String(row[1]||'').trim() || '未分类';
        const company = String(row[2]||'').trim();
        const name = String(row[3]||'').trim();
        const title = String(row[4]||'').trim();
        const phone = String(row[5]||'').trim();
        const driver = String(row[6]||'').trim() === '是';
        const plate = String(row[7]||'').trim();
        // 手机号查重：重复则不分配座位，放入未入座
        const isDup = phone && state.people.find(p => p.phone === phone);
        if (isDup) dup++;
        const p = {
          id: uid(), nature, company, name, title, phone, driver, plate,
          seatedAt: null
        };
        // 解析座位号（重复手机号不自动入座）
        if (seatNo && !isDup) {
          const parts = seatNo.split('-');
          if (parts.length === 3) {
            const rname = parts[0];
            const ri = parseInt(parts[1]) - 1;
            const ci = parseInt(parts[2]) - 1;
            // 兼容 "A" 和 "A区" 两种写法
            const r = state.regions.find(r => r.name === rname || r.name === rname + '区' || r.name.replace(/区$/,'') === rname);
            if (r && r.seats[ri] && !r.seats[ri][ci]) {
              r.seats[ri][ci] = {personId: p.id};
              p.seatedAt = {regionId: r.id, row: ri, col: ci};
              seated++;
            }
          }
        }
        state.people.push(p);
        n++;
      }
      renderAll();
      toast(`已导入 ${n} 人（${seated}人入座，${dup}人手机号重复转为未入座）`);
    } catch(err) { alert('导入失败：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}
function exportPeople() {
  try {
    if (typeof XLSX === 'undefined') { alert('Excel库未加载，请检查网络后刷新'); return; }
  const list = state.people.filter(p => p.seatedAt);
  list.sort((a,b) => {
    const ra = state.regions.findIndex(r => r.id === a.seatedAt.regionId);
    const rb = state.regions.findIndex(r => r.id === b.seatedAt.regionId);
    if (ra !== rb) return ra - rb;
    if (a.seatedAt.row !== b.seatedAt.row) return a.seatedAt.row - b.seatedAt.row;

  });
  const data = [['区域','排','列','座位号','公司性质','公司名称','人员姓名','职位','手机号','是否驾车','车牌号']];
  list.forEach(p => {

// ==================== 全局布局视图 ====================
function toggleLayoutMode() {
  state.layoutMode = !state.layoutMode;
  document.getElementById('layoutModeBtn').classList.toggle('on', state.layoutMode);
  document.getElementById('stageNormal').classList.toggle('hidden', state.layoutMode);
  document.getElementById('seatRegion').classList.toggle('hidden', state.layoutMode);
  document.getElementById('layoutViewport').classList.toggle('hidden', !state.layoutMode);
  document.getElementById('canvasWrap').classList.toggle('full', state.layoutMode);
  if (state.layoutMode) {
    fitLayoutView();
    renderLayoutView();
  }
}
function fitLayoutView() {
  const vp = document.getElementById('layoutViewport');
  const vw = vp.clientWidth, vh = vp.clientHeight;
  // 计算所有区域包围盒
  let minGx=Infinity,maxGx=-Infinity,minGy=Infinity,maxGy=-Infinity;
  state.regions.forEach(r => {
    minGx = Math.min(minGx, r.gx); maxGx = Math.max(maxGx, r.gx);
    minGy = Math.min(minGy, r.gy); maxGy = Math.max(maxGy, r.gy);
  });
  // 每个区域格位约 620px 宽，420px 高（含间距）
  const contentW = (maxGx - minGx + 1) * 680;
  const contentH = (maxGy - minGy + 1) * 480 + 200;
  state.viewScale = Math.min(1.0, Math.min(vw / contentW, vh / contentH));
  state.viewX = (vw - contentW * state.viewScale) / 2;
  state.viewY = 40;
}
function renderLayoutView() {
  const canvas = document.getElementById('layoutCanvas');
  const container = document.getElementById('layoutRegions');
  container.innerHTML = '';
  canvas.style.transform = `translate(${state.viewX}px, ${state.viewY}px) scale(${state.viewScale})`;

  let minGx=Infinity,maxGx=-Infinity,minGy=Infinity,maxGy=-Infinity;
  state.regions.forEach(r => {
    minGx = Math.min(minGx, r.gx); maxGx = Math.max(maxGx, r.gx);
    minGy = Math.min(minGy, r.gy); maxGy = Math.max(maxGy, r.gy);
  });
  // 按所有区域最大行列数统一卡片尺寸，确保座位完整显示不滚动
  let maxCols = 0, maxRows = 0;
  state.regions.forEach(r => { maxCols = Math.max(maxCols, r.cols); maxRows = Math.max(maxRows, r.rows); });
  const seatW = 76, seatH = 60, gap = 6;
  const CELL_W = maxCols * seatW + (maxCols-1) * gap + 20;
  const CELL_H = maxRows * seatH + (maxRows-1) * gap + 50;
  const GAP = 50;
  const totalCols = maxGx - minGx + 1;
  const totalRows = maxGy - minGy + 1;
  const contentW = totalCols * CELL_W + (totalCols - 1) * GAP;
  const contentH = totalRows * CELL_H + (totalRows - 1) * GAP + 110;
  canvas.style.width = contentW + 'px';
  canvas.style.height = contentH + 'px';

  // 舞台水平居中于所有区域总宽度
  const stage = canvas.querySelector('.layout-stage');
  stage.style.width = Math.min(500, contentW * 0.5) + 'px';
  stage.style.margin = '0 auto 40px';
  stage.style.position = 'relative';
  const stageOffset = 90;

  container.style.position = 'relative';
  container.style.width = contentW + 'px';
  container.style.height = (contentH - 110) + 'px';

  state.regions.forEach(r => {
    const div = document.createElement('div');
    div.className = 'layout-region' + (r.id === state.selectedRegionId ? ' active' : '');
    const px = (r.gx - minGx) * (CELL_W + GAP);
    const py = (r.gy - minGy) * (CELL_H + GAP) + stageOffset;
    div.style.left = px + 'px';
    div.style.top = py + 'px';
    div.style.width = CELL_W + 'px';
    div.style.height = CELL_H + 'px';
    div.style.padding = '10px';
    div.style.display = 'flex';
    div.style.flexDirection = 'column';
    div.style.alignItems = 'center';
    div.innerHTML = `<div class="lr-label">${r.name}</div>`;
    // 座位居中，不滚动
    const g = document.createElement('div');
    g.className = 'layout-seat-grid';
    g.style.gridTemplateColumns = `repeat(${r.cols}, 76px)`;
    g.style.gap = '6px';
    g.style.margin = 'auto';
    for (let si = 0; si < r.rows; si++) {
      for (let sj = 0; sj < r.cols; sj++) {
        const s = r.seats[si][sj];
        const seatId = r.name + '-' + (si+1) + '-' + (sj+1);
        const d = document.createElement('div');
        d.className = 'seat';
        d.dataset.seat = r.id + '-' + si + '-' + sj;
        d.style.width = '76px'; d.style.height = '60px';
        d.style.overflow = 'hidden';
        // 高亮定位座位
        if (state.highlightSeat && state.highlightSeat.regionId === r.id && state.highlightSeat.row === si && state.highlightSeat.col === sj) {
          d.style.background = '#F59E0B';
          d.style.border = '3px solid #F59E0B';
          d.style.animation = 'locateFlash 0.6s infinite';
        }
        if (s && s.off) {
          d.classList.add('off');
          d.innerHTML = `<div class="seat-id">${seatId}</div>`;
          if (state.editMode) {
            d.onclick = () => { r.seats[si][sj] = null; renderAll(); };
          }
        } else if (s && s.personId) {
          const p = state.people.find(pp => pp.id === s.personId);
          d.classList.add('occupied');
          if (p) {
            d.style.background = getNatureColor(p.nature);
            d.style.borderColor = getNatureColor(p.nature);
            d.innerHTML = `<div class="seat-id">${seatId}</div><div class="seat-name">${esc(p.name)}</div><div class="seat-meta">${esc(p.company)}</div><div class="seat-meta">${esc(p.title||'')}</div>`;
            d.draggable = true;
            d.ondragstart = (e) => {
              e.dataTransfer.setData('dragPerson', p.id);
              e.stopPropagation();
              hideTooltip();
            };
            d.onmouseenter = (e) => { if (!state.spaceDown) showTooltip(e, p, seatId); };
            d.onmouseleave = hideTooltip;
            d.onclick = (e) => { e.stopPropagation(); openSeatMenu(e, r.id, si, sj, p); };
          }
        } else {
          d.classList.add('empty');
          d.innerHTML = `<div class="seat-id">${seatId}</div>`;
          d.onclick = () => {
            if (state.editMode) {
              r.seats[si][sj] = (s && s.off) ? null : {off:true};
              renderAll();
            } else {
              openPickPerson(r.id, si, sj);
            }
          };
        }
        d.ondragover = (e) => { if (!state.spaceDown) { e.preventDefault(); d.classList.add('drag-over'); } };
        d.ondragleave = () => d.classList.remove('drag-over');
        d.ondrop = (e) => {
          e.preventDefault(); e.stopPropagation();
          d.classList.remove('drag-over');
          onSeatDrop(r.id, si, sj, e);
        };
        g.appendChild(d);
      }
    }
    div.appendChild(g);
    div.onclick = () => {
      state.selectedRegionId = r.id;
      renderAll();
    };
    container.appendChild(div);
  });
  drawMinimap(minGx, maxGx, minGy, maxGy, CELL_W, CELL_H, GAP);
}
// 小地图参数缓存
let mmParams = {offX:0, offY:0, scale:1, contentW:0, contentH:0};
function drawMinimap(minGx, maxGx, minGy, maxGy, CELL_W, CELL_H, GAP) {
  const cv = document.getElementById('minimapCanvas');
  const ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  ctx.clearRect(0, 0, W, H);
  const contentW = (maxGx - minGx + 1) * (CELL_W + GAP);
  const contentH = (maxGy - minGy + 1) * (CELL_H + GAP) + 110;
  const scale = Math.min((W-10)/contentW, (H-10)/contentH);
  const offX = (W - contentW*scale)/2;
  const offY = (H - contentH*scale)/2;
  mmParams = {offX, offY, scale, contentW, contentH};
  // 舞台固定在小地图顶部居中
  ctx.fillStyle = '#2D3142';
  const sw = W * 0.5;
  ctx.fillRect((W - sw)/2, 6, sw, 14);
  // 画区域（在舞台下方）
  state.regions.forEach(r => {
    const px = offX + (r.gx - minGx)*(CELL_W+GAP)*scale;
    const py = offY + 28 + (r.gy - minGy)*(CELL_H+GAP)*scale;
    ctx.fillStyle = r.id === state.selectedRegionId ? '#4F6EF7' : '#C8CBD6';
    ctx.fillRect(px, py, CELL_W*scale, CELL_H*scale*0.6);
  });
  // 画视口框
  const vp = document.getElementById('layoutViewport');
  const vw = vp.clientWidth, vh = vp.clientHeight;
  ctx.strokeStyle = '#E5484D';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(
    offX - state.viewX/state.viewScale*scale,
    offY - state.viewY/state.viewScale*scale,
    vw/state.viewScale*scale,
    vh/state.viewScale*scale
  );
}
// 缩放/平移事件
function initLayoutEvents() {
  const vp = document.getElementById('layoutViewport');
  vp.addEventListener('wheel', (e) => {
    if (!state.layoutMode) return;
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.max(0.2, Math.min(2.5, state.viewScale * delta));
    // 以鼠标为中心缩放
    const rect = vp.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const ratio = newScale / state.viewScale;
    state.viewX = mx - (mx - state.viewX) * ratio;
    state.viewY = my - (my - state.viewY) * ratio;
    state.viewScale = newScale;
    renderLayoutView();
  }, {passive:false});
  vp.addEventListener('mousedown', (e) => {
    if (!state.layoutMode || !state.spaceDown) return;
    state.panStart = {x: e.clientX, y: e.clientY, vx: state.viewX, vy: state.viewY};
    vp.classList.add('panning');
  });
  document.addEventListener('mousemove', (e) => {
    if (!state.panStart) return;
    state.viewX = state.panStart.vx + (e.clientX - state.panStart.x);
    state.viewY = state.panStart.vy + (e.clientY - state.panStart.y);
    renderLayoutView();
  });
  document.addEventListener('mouseup', () => {
    state.panStart = null;
    vp.classList.remove('panning');
  });
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'SELECT') {
      state.spaceDown = true;
      e.preventDefault();
    }
  });
  document.addEventListener('keyup', (e) => {
    if (e.code === 'Space') state.spaceDown = false;
  });
  // 小地图点击/拖动平移
  const mm = document.getElementById('minimapCanvas');
  function mmJump(e) {
    const rect = mm.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    // 换算成全图坐标
    const fullX = (mx - mmParams.offX) / mmParams.scale;
    const fullY = (my - mmParams.offY) / mmParams.scale;
    const vp = document.getElementById('layoutViewport');
    state.viewX = vp.clientWidth/2 - fullX * state.viewScale;
    state.viewY = vp.clientHeight/2 - fullY * state.viewScale;
    renderLayoutView();
  }
  mm.addEventListener('mousedown', (e) => {
    mmJump(e);
    const move = (ev) => mmJump(ev);
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

  // 舞台居中于内容宽度
  const stage = document.createElement('div');
  stage.style.cssText = 'width:'+Math.min(500, contentW*0.5)+'px;margin:0 auto 30px;background:#2D3142;color:#fff;text-align:center;padding:12px;border-radius:8px;letter-spacing:6px;font-size:14px';
  stage.textContent = '舞 台';
  offscreen.appendChild(stage);
  const regionsBox = document.createElement('div');
  regionsBox.style.cssText = 'position:relative;width:' + ((maxGx-minGx+1)*CELL_W + (maxGx-minGx)*GAP) + 'px;height:' + ((maxGy-minGy+1)*CELL_H + (maxGy-minGy)*GAP) + 'px';
  state.regions.forEach(r => {
    const box = document.createElement('div');
    box.style.cssText = 'position:absolute;left:' + ((r.gx-minGx)*(CELL_W+GAP)) + 'px;top:' + ((r.gy-minGy)*(CELL_H+GAP)) + 'px;width:' + CELL_W + 'px;height:' + CELL_H + 'px;background:#fff;border:1px solid #E3E5EC;border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center';
    box.innerHTML = '<div style="font-size:14px;font-weight:600;margin-bottom:8px">' + r.name + '</div>';
    const g = document.createElement('div');
    g.style.cssText = 'display:grid;grid-template-columns:repeat(' + r.cols + ',76px);gap:6px;flex:1;align-content:center';
    for (let si = 0; si < r.rows; si++) {
      for (let sj = 0; sj < r.cols; sj++) {
        const s = r.seats[si][sj];
        const seatId = r.name + '-' + (si+1) + '-' + (sj+1);
        const d = document.createElement('div');
        d.style.cssText = 'width:76px;height:60px;border-radius:8px;border:1px solid #E3E5EC;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:3px;text-align:center;overflow:hidden;font-family:sans-serif';
        if (s && s.off) {
          d.style.background = '#C8CBD6';
          d.innerHTML = '<div style="font-size:9px;opacity:.7">' + seatId + '</div>';
        } else if (s && s.personId) {
          const p = state.people.find(pp => pp.id === s.personId);
          const c = getNatureColor(p.nature);
          d.style.background = c;
          d.style.color = '#fff';
          d.style.borderColor = c;
          d.innerHTML = '<div style="font-size:9px;opacity:.7;line-height:1">' + seatId + '</div><div style="font-size:11px;font-weight:600;line-height:1.2">' + esc(p.name) + '</div><div style="font-size:9px;opacity:.85;line-height:1.2">' + esc(p.company) + '</div><div style="font-size:9px;opacity:.85;line-height:1.2">' + esc(p.title||'') + '</div>';
        } else {
          d.style.background = '#fff';
          d.innerHTML = '<div style="font-size:9px;opacity:.5">' + seatId + '</div>';
        }
        g.appendChild(d);
      }
    }
    box.appendChild(g);
    regionsBox.appendChild(box);
  });
  offscreen.appendChild(regionsBox);
  // 图例
  const legend = document.createElement('div');
  legend.style.cssText = 'margin-top:20px;display:flex;gap:16px;justify-content:center;font-size:12px;flex-wrap:wrap';
  Object.keys(natureColorMap).forEach(n => {
    legend.innerHTML += '<span style="display:flex;align-items:center;gap:4px"><span style="width:12px;height:12px;border-radius:3px;background:'+natureColorMap[n]+'"></span>'+esc(n)+'</span>';
  });
  offscreen.appendChild(legend);
  document.body.appendChild(offscreen);
  html2canvas(offscreen, {backgroundColor: '#ffffff', scale: 2, useCORS: true}).then(canvas => {
    document.body.removeChild(offscreen);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = '会议座位图.png';
    a.click();
    toast('已导出');
  }).catch(err => {
    if (document.body.contains(offscreen)) document.body.removeChild(offscreen);
    alert('导出失败：' + err.message);
  });
  } catch(err) { alert('导出出错：' + err.message); }
}

// 三栏拖拽调宽
function initResizers() {
  const r1 = document.getElementById('resizer1');
  const r2 = document.getElementById('resizer2');
  const left = document.querySelector('.col-left');
  const right = document.querySelector('.col-right');
  function startDrag(which, e) {
    e.preventDefault();
    const startX = e.clientX;
    const startW = which === 1 ? left.offsetWidth : right.offsetWidth;
    document.querySelectorAll('.col-resizer').forEach(el => el.classList.add('active'));
    function onMove(ev) {
      const dx = ev.clientX - startX;
      if (which === 1) left.style.width = Math.max(200, startW + dx) + 'px';
      else right.style.width = Math.max(260, startW - dx) + 'px';
    }
    function onUp() {
      document.querySelectorAll('.col-resizer').forEach(el => el.classList.remove('active'));
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  }
  r1.addEventListener('mousedown', (e) => startDrag(1, e));
  r2.addEventListener('mousedown', (e) => startDrag(2, e));
}

// 批量移动
function openMoveModal() {
  document.getElementById('moveScopeTip').textContent = state.layoutMode
    ? '当前为全局视图：以下操作影响整个会场的所有区域'
    : '当前为主视图：以下操作仅影响当前区域';
  document.getElementById('moveModal').classList.add('show');
}
function targetRegions() {
  return state.layoutMode ? state.regions : [curRegion()];
}
function releasePerson(p) { p.seatedAt = null; }
function doShiftAllRow(dir) {
  const n = parseInt(document.getElementById('shiftRowN').value) || 1;
  const offset = dir * n;
  confirmDialog('全员纵向移动', `确定将${state.layoutMode?'全场':'当前区域'}所有人${offset>0?'后移':'前移'}${Math.abs(offset)}排？超出边界的人员将放入未入座列表。`, () => {
    targetRegions().forEach(r => {
      const newSeats = [];
      for (let i = 0; i < r.rows; i++) {
        const row = [];
        for (let j = 0; j < r.cols; j++) {
          const src = i - offset;
          if (src >= 0 && src < r.rows) {
            const s = r.seats[src][j];
            row.push(s && s.off ? {off:true} : (s && s.personId ? {personId: s.personId} : null));
          } else {
            row.push(null);
          }
        }
        newSeats.push(row);
      }
      // 更新人员位置
      for (let i = 0; i < r.rows; i++)
        for (let j = 0; j < r.cols; j++) {
          const s = r.seats[i][j];
          if (s && s.personId) {
            const p = state.people.find(pp => pp.id === s.personId);
            if (p) releasePerson(p);
          }
        }
      r.seats = newSeats;
      for (let i = 0; i < r.rows; i++)
        for (let j = 0; j < r.cols; j++) {
          const s = r.seats[i][j];
          if (s && s.personId) {
            const p = state.people.find(pp => pp.id === s.personId);
            if (p) p.seatedAt = {regionId: r.id, row: i, col: j};
          }
        }
    });
    renderAll();
    toast('已完成');
  });
}
function doShiftAllCol(dir) {
  const n = parseInt(document.getElementById('shiftColN').value) || 1;
  const offset = dir * n;
  confirmDialog('全员横向移动', `确定将${state.layoutMode?'全场':'当前区域'}所有人${offset>0?'右移':'左移'}${Math.abs(offset)}列？超出边界的人员将放入未入座列表。`, () => {
    targetRegions().forEach(r => {
      const newSeats = [];
      for (let i = 0; i < r.rows; i++) {
        const row = [];
        for (let j = 0; j < r.cols; j++) {
          const src = j - offset;
          if (src >= 0 && src < r.cols) {
            const s = r.seats[i][src];
            row.push(s && s.off ? {off:true} : (s && s.personId ? {personId: s.personId} : null));
          } else row.push(null);
        }
        newSeats.push(row);
      }
      for (let i = 0; i < r.rows; i++)
        for (let j = 0; j < r.cols; j++) {
          const s = r.seats[i][j];
          if (s && s.personId) { const p = state.people.find(pp => pp.id === s.personId); if (p) releasePerson(p); }
        }
      r.seats = newSeats;
      for (let i = 0; i < r.rows; i++)
        for (let j = 0; j < r.cols; j++) {
          const s = r.seats[i][j];
          if (s && s.personId) { const p = state.people.find(pp => pp.id === s.personId); if (p) p.seatedAt = {regionId: r.id, row: i, col: j}; }
        }
    });
    renderAll();
    toast('已完成');
  });
}
function doShiftRow(dir) {
  const rowNo = (parseInt(document.getElementById('rowNo').value) || 1) - 1;
  const n = parseInt(document.getElementById('rowShiftN').value) || 1;
  const offset = dir * n;
  const r = curRegion(); if (!r) return;
  if (rowNo < 0 || rowNo >= r.rows) { toast('行号超出范围'); return; }
  confirmDialog('指定行移动', `确定将第${rowNo+1}排整体${offset>0?'下':'上'}移${Math.abs(offset)}排？被挤到边界外的人员将放入未入座列表。`, () => {
    // 取出该行
    const rowData = r.seats[rowNo].map(s => s ? JSON.parse(JSON.stringify(s)) : null);
    // 清空该行
    r.seats[rowNo] = new Array(r.cols).fill(null);
    // 逐格放置
    for (let j = 0; j < r.cols; j++) {
      const s = rowData[j];
      if (!s || s.off) continue;
      let target = rowNo + offset;
      // 链式顺移
      while (target >= 0 && target < r.rows) {
        const cur = r.seats[target][j];
        if (!cur) {
          r.seats[target][j] = {personId: s.personId};
          const p = state.people.find(pp => pp.id === s.personId);
          if (p) p.seatedAt = {regionId: r.id, row: target, col: j};
          break;
        } else if (cur.personId) {
          // 交换，继续挤
          const tmpId = cur.personId;
          r.seats[target][j] = {personId: s.personId};
          const p1 = state.people.find(pp => pp.id === s.personId);
          if (p1) p1.seatedAt = {regionId: r.id, row: target, col: j};
          s.personId = tmpId;
          target += offset;
        } else {
          break;
        }
      }
      // 超出边界，释放
      if (target < 0 || target >= r.rows) {
        const p = state.people.find(pp => pp.id === s.personId);
        if (p) releasePerson(p);
      }
    }
    renderAll();
    toast('已完成');
  });
}
function doShiftCol(dir) {
  const colNo = (parseInt(document.getElementById('colNo').value) || 1) - 1;
  const n = parseInt(document.getElementById('colShiftN').value) || 1;
  const offset = dir * n;
  const r = curRegion(); if (!r) return;
  if (colNo < 0 || colNo >= r.cols) { toast('列号超出范围'); return; }
  confirmDialog('指定列移动', `确定将第${colNo+1}列整体${offset>0?'右':'左'}移${Math.abs(offset)}列？被挤到边界外的人员将放入未入座列表。`, () => {
    const colData = [];
    for (let i = 0; i < r.rows; i++) colData.push(r.seats[i][colNo] ? JSON.parse(JSON.stringify(r.seats[i][colNo])) : null);
    for (let i = 0; i < r.rows; i++) r.seats[i][colNo] = null;
    for (let i = 0; i < r.rows; i++) {
      const s = colData[i];
      if (!s || s.off) continue;
      let target = colNo + offset;
      while (target >= 0 && target < r.cols) {
        const cur = r.seats[i][target];
        if (!cur) {
          r.seats[i][target] = {personId: s.personId};
          const p = state.people.find(pp => pp.id === s.personId);
          if (p) p.seatedAt = {regionId: r.id, row: i, col: target};
          break;
        } else if (cur.personId) {
          const tmpId = cur.personId;
          r.seats[i][target] = {personId: s.personId};
          const p1 = state.people.find(pp => pp.id === s.personId);
          if (p1) p1.seatedAt = {regionId: r.id, row: i, col: target};
          s.personId = tmpId;
          target += offset;
        } else break;
      }
      if (target < 0 || target >= r.cols) {
        const p = state.people.find(pp => pp.id === s.personId);
        if (p) releasePerson(p);
      }
    }
    renderAll();
    toast('已完成');
  });
}
